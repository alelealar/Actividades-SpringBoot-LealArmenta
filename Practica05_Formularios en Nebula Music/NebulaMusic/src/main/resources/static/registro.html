<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            <form class="auth-form" method="post" action="/crear-cuenta" enctype="application/x-www-form-urlencoded">
                <h1>Crear cuenta</h1>

                <div>

                    <label for="nombre">Nombre completo: </label>
                    <input type="text" id="nombre" name="nombre" placeholder="ej. Alejandra Leal" required minlength="3" maxlength="80">

                    <div>
                        <label for="correo">Correo electrónico:</label>
                        <input type="email" id="correo" name="correo" placeholder="ale@gmail.com" required maxlength="100">
                    </div>

                    <div>
                        <label for="cotrasena">Contraseña: </label>
                        <input type="password" id="contrasena" name="contrasena" placeholder="Minimo 8 caracteres" required minlength="8" autocomplete="off">
                    </div>

                    <div>
                        <label for="pseudonimo">Pseudonimo</label>
                        <input type="text" id="pseudonimo1" name="pseudonimo" required pattern="[a-zA-Z]{3,10}-[0-9]{2,10}" placeholder="Nebula-2025" minlength="6">
                    </div>

                    <div>
                        <label>Genero: </label>
                        <input type="radio" id="rad_femenino" name="genero" value="femenino" required>
                        <label for="rad_femenino">Femenino</label>
                        <input type="radio" id="rad_masculino" name="genero" value="masculino" required>
                        <label for="rad_masculino">Masculino</label>
                        <input type="radio" id="rad_otro" name="genero" value="otro" required>
                        <label for="rad_otro">Otro</label>
                    </div>

                    <div>
                        <label for="suscripcion">Tipo de suscripción</label>
                        <select id="suscripcion" name="suscripcion" required>
                            <option value="">---- Selecciona una opcion ----</option>
                            <option value="gratis">---- Gratis (con anuncios) ----</option>
                            <option value="premium_mensual">---- Premiun Mensual ($99/mes) ----</option>
                            <option value="premium_anual">---- Premium Anual (899$/año) ----</option>
                        </select>
                    </div>

                    <div>
                        <label for="fechaNacimiento">Fecha de nacimiento</label>
                        <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
                    </div>

                </div>

                <div>
                    <input type="checkbox" id="terminos" value="aceptado" required>
                    <label for="terminos">Acepto los terminos y condiciones de uso</label>
                </div>

                <div>
                    <label for="comentarios">Comentarios o Gustos</label>
                    <textarea id="comentarios" name="comentarios" rows="4" cols="40" placeholder="Cuentanos que musica te gusta">

                    </textarea>
                </div>
                <div>
                    <button type="reset">Limpiar formulario</button>
                    <button type="submit">Iniciar sesión</button>
                </div>
                <p>¿Ya tienes cuenta? <a href="iniciar-sesion.html.html">Iniciar Sesión</a></p>
            </form>

        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
