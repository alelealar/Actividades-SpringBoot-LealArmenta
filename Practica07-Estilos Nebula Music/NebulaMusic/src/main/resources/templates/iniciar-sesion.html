<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Iniciar Sesión</title>
    <link rel="stylesheet" href="../static/styles/styles.css">
</head>
<body>

<main class="auth-container">
    <section class="auth-card">
        <img class="logo-nebula" src="../static/imgs/nebula-03.png" alt="logo nebula music">
        <form method="post" action="/autentication" enctype="application/x-www-form-urlencoded">
            <h1 id="iniciar-sesion">Inicio de sesión</h1>
            <div>
                <label for="correo">
                    Correo Electronico
                </label> <br>
                <input type="email" name="correo" id="correo" placeholder="correo@dominio.com" required minlength="5" maxlength="100">
            </div>
            <div>
                <label for="contrasena">Contraseña: </label> <br>
                <input type="password" name="contrasena" id="contrasena" placeholder="****" required>
            </div>

            <div class="buttons-inicia-sesion">
                <button type="reset">Limpiar formulario</button>
                <br>
                <button type="submit">Iniciar sesión</button>
                <br>
                <button type="button" onclick="window.location.href='index.html'">Cancelar</button>
            </div>
        </form>
        <p>¿Aún no tienes cuenta? <a href="registro.html">Registrate aqui</a></p>
    </section>
</main>

<footer>
    <p>Copyright Nébula 2025.</p>
</footer>

</body>
</html>
